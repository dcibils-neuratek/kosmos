#
# **OpenSSL's targets for Kosmos** (`docs/w5.md` W5d): what `kosmos.cmake`
# is to a library built by CMake, this is to OpenSSL's own `Configure`,
# which takes it with `--config` (`tools/w5_build.py`). The same compiler,
# the same headers - the POSIX layer's first - and the same base address.
#
# Its assembly is kept: AES-NI, SHA and the vector code on x86-64, NEON and
# the crypto extensions on ARM, chosen at run time from what the processor
# says it has. The assembler is the one the C compiler is.

my $root = $ENV{KOSMOS_ROOT} or die "KOSMOS_ROOT is the Kosmos tree";
my $llvm = $ENV{KOSMOS_LLVM} || "/opt/homebrew/opt/llvm";
my $resource = `$llvm/bin/clang -print-resource-dir`;
chomp $resource;

my $flags = "-nostdinc -isystem $root/runtime/posix/include -D__kosmos__"
    . " -isystem $resource/include -isystem $root/runtime/include"
    . " -isystem $root/user/include -DKOSMOS_USER"
    . " -ffunction-sections -fdata-sections -fno-stack-protector"
    . " -Wno-unused-command-line-argument"
    # The names Kosmos refuses, as headers that refuse them: OpenSSL's
    # sockets include `sys/ioctl.h` whatever they are built for, and its
    # ARM capabilities `signal.h`.
    . " -isystem $root/runtime/posix/refused"
    # There is no system log: the log BIO is OpenSSL's own null one.
    . " -DNO_SYSLOG";

my %targets = (
    "kosmos-common" => {
        inherit_from     => [ "BASE_unix" ],
        template         => 1,
        CC               => "$llvm/bin/clang",
        AR               => "$llvm/bin/llvm-ar",
        RANLIB           => "$llvm/bin/llvm-ranlib",
        CFLAGS           => "-O3",
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        # Threads are the POSIX layer's pthreads; there is no `dlopen`.
        thread_scheme    => "pthreads",
        dso_scheme       => undef,
        sys_id           => "KOSMOS",
    },
    "kosmos-x86_64" => {
        inherit_from     => [ "kosmos-common" ],
        cflags           => "--target=x86_64-unknown-none-elf $flags -DKOSMOS_USER_BASE=0x40000000",
        lib_cppflags     => "-DL_ENDIAN",
        asm_arch         => "x86_64",
        perlasm_scheme   => "elf",
    },
    "kosmos-aarch64" => {
        inherit_from     => [ "kosmos-common" ],
        # What the processor can do comes from `getauxval` (`sys/auxv.h`,
        # the ID registers Nebula hands a process) rather than from probing
        # each instruction and catching the SIGILL, which needs signals.
        # The macro is the one `armcap.c` sets for itself on glibc and the
        # BSDs; nothing there undefines it.
        cflags           => "--target=aarch64-unknown-none-elf $flags -DKOSMOS_USER_BASE=0x4000000000"
                            . " -DOSSL_IMPLEMENT_GETAUXVAL -include sys/auxv.h",
        lib_cppflags     => "-DL_ENDIAN",
        asm_arch         => "aarch64",
        perlasm_scheme   => "linux64",
    },
);
