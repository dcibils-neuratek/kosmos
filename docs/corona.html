<!--
  A third desktop, in the manner of the Solaris desktop of 1997-2004 (CDE):
  the Front Panel, four workspaces, Motif windows with their window menu,
  subpanels, the Style Manager. Diego, 7 November 2026: "a desktop that i
  always loved is the old solaris desktop from SUN", "can we do a mockup of
  a 3rd desktop that replicates the solaris experience?". Playable, drawn
  before anything is agreed. Diego, the same day: "keep Corona, CDE, and give
  it a 2026 pass too" - so the switch at the Front Panel's right end flips it
  between CDE as Solaris drew it and CDE reimagined for 2026. Every picture
  here is drawn fresh, in CSS and SVG.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kosmos in Corona</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root {
    --bg: #aeb2c3; --top: #e1e3ec; --bot: #5f6478; --field: #c9ccd8; --ink: #000;
    --act: #a65d82; --act-top: #d39cb8; --act-bot: #63304b; --act-ink: #fff;
    --inact: #aeb2c3; --sel: #6c7fa8; --sel-ink: #fff;
    --panel: #aeb2c3; --sys: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", Menlo, monospace;
    --ws: #3f7d86;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font: 12px/1.35 var(--sys); color: var(--ink); background: var(--ws); user-select: none; cursor: default; }
  body.busy, body.busy * { cursor: wait !important; }
  #desk { position: fixed; inset: 0; }
  /* Motif bevels: two pixels, light above and left, dark below and right */
  .rz { box-shadow: inset 2px 2px 0 var(--top), inset -2px -2px 0 var(--bot); background: var(--bg); }
  .sk { box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top); background: var(--field); }
  .rz1 { box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot); }
  .sk1 { box-shadow: inset 1px 1px 0 var(--bot), inset -1px -1px 0 var(--top); }
  button { font: inherit; color: inherit; }

  /* ---------- windows ---------- */
  .win { position: absolute; padding: 5px; background: var(--inact); box-shadow: inset 2px 2px 0 var(--top), inset -2px -2px 0 var(--bot), 0 0 0 1px #000; display: flex; flex-direction: column; min-width: 180px; min-height: 90px; }
  .win.act { background: var(--act); box-shadow: inset 2px 2px 0 var(--act-top), inset -2px -2px 0 var(--act-bot), 0 0 0 1px #000; }
  .tb { display: flex; height: 24px; gap: 0; flex: none; }
  .tb .b { width: 24px; height: 24px; border: 0; padding: 0; background: inherit; box-shadow: inset 2px 2px 0 var(--top), inset -2px -2px 0 var(--bot); display: flex; align-items: center; justify-content: center; }
  .win.act .tb .b, .win.act .tb .t { box-shadow: inset 2px 2px 0 var(--act-top), inset -2px -2px 0 var(--act-bot); }
  .tb .b:active { box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top) !important; }
  .tb .t { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12.5px; box-shadow: inset 2px 2px 0 var(--top), inset -2px -2px 0 var(--bot); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
  .win.act .tb .t { color: var(--act-ink); }
  .ic-menu { width: 13px; height: 4px; box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot); }
  .ic-min { width: 5px; height: 5px; box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot); }
  .ic-max { width: 13px; height: 13px; box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot); }
  .win.act .ic-menu, .win.act .ic-min, .win.act .ic-max { box-shadow: inset 1px 1px 0 var(--act-top), inset -1px -1px 0 var(--act-bot); }
  .client { flex: 1; display: flex; flex-direction: column; margin-top: 3px; background: var(--bg); box-shadow: inset 1px 1px 0 var(--bot), inset -1px -1px 0 var(--top); padding: 1px; min-height: 0; }
  .mbar { display: flex; gap: 2px; padding: 3px 4px; flex: none; box-shadow: inset 0 -1px 0 var(--bot), inset 0 1px 0 var(--top); }
  .mbar .m { padding: 2px 8px; }
  .mbar .m.open { box-shadow: inset 2px 2px 0 var(--top), inset -2px -2px 0 var(--bot); }
  .mbar .help { margin-left: auto; }
  u { text-decoration: underline; text-underline-offset: 1px; }
  .body { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .grip { position: absolute; }
  .g-n, .g-s { left: 18px; right: 18px; height: 6px; cursor: ns-resize; }
  .g-n { top: 0; } .g-s { bottom: 0; }
  .g-e, .g-w { top: 18px; bottom: 18px; width: 6px; cursor: ew-resize; }
  .g-e { right: 0; } .g-w { left: 0; }
  .g-ne, .g-nw, .g-se, .g-sw { width: 18px; height: 18px; }
  .g-nw { left: 0; top: 0; cursor: nwse-resize; } .g-se { right: 0; bottom: 0; cursor: nwse-resize; }
  .g-ne { right: 0; top: 0; cursor: nesw-resize; } .g-sw { left: 0; bottom: 0; cursor: nesw-resize; }
  .outline { position: absolute; border: 2px solid #fff; mix-blend-mode: difference; pointer-events: none; z-index: 900000; }

  /* ---------- menus ---------- */
  .menu { position: fixed; z-index: 1000000; background: var(--bg); box-shadow: inset 2px 2px 0 var(--top), inset -2px -2px 0 var(--bot), 1px 1px 0 #000; padding: 3px; min-width: 150px; }
  .menu .mt { text-align: center; font-weight: 600; padding: 3px 8px 4px; }
  .menu .tear { height: 7px; margin: 1px 3px 3px; background: repeating-linear-gradient(90deg, var(--bot) 0 4px, transparent 4px 7px); background-size: 100% 1px; background-repeat: repeat-x; background-position: 0 3px; }
  .menu .it { display: flex; gap: 16px; padding: 3px 10px 3px 18px; position: relative; white-space: nowrap; }
  .menu .it .k { margin-left: auto; color: #222; }
  .menu .it.hot { box-shadow: inset 2px 2px 0 var(--top), inset -2px -2px 0 var(--bot); }
  .menu .it.dis { color: #6d7185; }
  .menu .it.sub::after { content: "▸"; margin-left: auto; padding-left: 14px; }
  .menu .it.chk::before { content: ""; position: absolute; left: 5px; top: 7px; width: 7px; height: 7px; box-shadow: inset 1px 1px 0 var(--bot), inset -1px -1px 0 var(--top); }
  .menu .it.chk.on::before { background: var(--act); }
  .menu .sep { height: 2px; margin: 3px 2px; box-shadow: inset 0 1px 0 var(--bot), inset 0 -1px 0 var(--top); }

  /* ---------- the Front Panel ---------- */
  #panel { position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); display: flex; align-items: stretch; z-index: 500000; padding: 4px; box-shadow: inset 2px 2px 0 var(--top), inset -2px -2px 0 var(--bot), 0 0 0 1px #000; background: var(--panel); max-width: calc(100vw - 8px); }
  #panel .hdl { width: 16px; display: flex; flex-direction: column; gap: 3px; }
  #panel .hdl .hb { height: 16px; display: flex; align-items: center; justify-content: center; }
  #panel .hdl .bar { flex: 1; background: repeating-linear-gradient(90deg, var(--top) 0 2px, var(--bot) 2px 4px); margin: 0 4px; opacity: .7; }
  .fp { display: flex; flex-direction: column; width: 66px; margin: 0 1px; }
  .fp .arr { height: 13px; display: flex; align-items: center; justify-content: center; }
  .fp .arr svg { width: 11px; height: 8px; }
  .fp .arr.none { visibility: hidden; }
  .fp .cv { height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  .fp .cv:active, .fp .arr:active { box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top); }
  .fp .cv svg { width: 40px; height: 40px; }
  .fp .cv small { font-size: 9.5px; line-height: 1; }
  .sw { display: grid; grid-template-columns: 40px 1fr 40px; gap: 4px; padding: 4px; margin: 0 4px; width: 250px; }
  .sw .side { display: flex; flex-direction: column; gap: 4px; }
  .sw .side .cv { flex: 1; display: flex; align-items: center; justify-content: center; }
  .sw .side .cv:active, .wsb:active { box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top); }
  .busy-l { height: 10px; margin: 0 6px; box-shadow: inset 1px 1px 0 var(--bot), inset -1px -1px 0 var(--top); background: #4a3b2a; }
  .busy-l.on { background: #ffcf4a; }
  .wsg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .wsb { display: flex; align-items: center; justify-content: center; font-weight: 600; height: 30px; padding: 0 4px; overflow: hidden; white-space: nowrap; }
  .wsb.cur { box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top); background: var(--field); }
  .wsb input { width: 100%; font: inherit; border: 0; background: #fff; text-align: center; }
  .sub { position: fixed; z-index: 600000; background: var(--bg); box-shadow: inset 2px 2px 0 var(--top), inset -2px -2px 0 var(--bot), 0 0 0 1px #000; padding: 4px; width: 200px; }
  .sub .stb { display: flex; height: 20px; margin-bottom: 3px; }
  .sub .stb .t { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .sub .stb .b { width: 20px; display: flex; align-items: center; justify-content: center; }
  .sub .inst { margin: 2px 2px 4px; padding: 6px; text-align: center; color: #333; font-size: 11px; }
  .sub .row { display: flex; align-items: center; gap: 8px; padding: 3px 6px; }
  .sub .row:hover { box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot); }
  .sub .row svg { width: 26px; height: 26px; flex: none; }

  /* ---------- minimised windows: icons on the workspace ---------- */
  .dicon { position: absolute; width: 76px; display: flex; flex-direction: column; align-items: center; z-index: 2; }
  .dicon .p { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; }
  .dicon .p svg { width: 40px; height: 40px; }
  .dicon .l { margin-top: 1px; padding: 1px 4px; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
  .dicon.sel .l { background: var(--act); color: #fff; }

  /* ---------- the applications ---------- */
  .term { position: absolute; inset: 2px; background: #fff; color: #000; font: 12.5px/1.35 var(--mono); padding: 4px 6px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; user-select: text; cursor: text; }
  .term .cur { background: #000; color: #fff; }
  .fm-path { display: flex; gap: 6px; align-items: center; padding: 4px 6px; flex: none; }
  .fm-path .f { flex: 1; padding: 3px 6px; font-family: var(--mono); font-size: 11.5px; }
  .fm-grid { position: absolute; inset: 0; margin: 2px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px 4px; padding: 8px; overflow: auto; background: var(--field); box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top); }
  .fi { width: 84px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px; }
  .fi svg { width: 34px; height: 34px; }
  .fi span { text-align: center; font-size: 11px; padding: 0 3px; word-break: break-word; }
  .fi.sel span { background: var(--sel); color: var(--sel-ink); }
  .fm-st { padding: 3px 8px; flex: none; font-size: 11px; }
  .pad { position: absolute; inset: 2px; border: 0; resize: none; outline: none; padding: 6px 8px; font: 12.5px/1.4 var(--mono); background: #fff; color: #000; box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top); user-select: text; }
  .cal { position: absolute; inset: 0; display: grid; grid-template-columns: 1.3fr 1fr; gap: 6px; padding: 6px; }
  .cal .mo { display: flex; flex-direction: column; }
  .cal .hd { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 6px; font-weight: 700; font-size: 13px; }
  .cal .grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal .dn { text-align: center; font-weight: 600; font-size: 11px; padding: 2px; }
  .cal .d { padding: 3px 4px; font-size: 11.5px; min-height: 26px; position: relative; }
  .cal .d.out { color: #6d7185; }
  .cal .d.today { background: var(--act); color: #fff; }
  .cal .d.pick { outline: 2px solid #000; outline-offset: -2px; }
  .cal .d i { position: absolute; right: 4px; bottom: 4px; width: 5px; height: 5px; background: #000; }
  .cal .d.today i { background: #fff; }
  .cal .ap { padding: 8px; overflow: auto; }
  .cal .ap h4 { margin: 0 0 6px; font-size: 13px; }
  .cal .ap .e { display: flex; gap: 8px; padding: 3px 0; }
  .cal .ap .e b { font-family: var(--mono); font-weight: 600; width: 46px; }
  .sm { position: absolute; inset: 0; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; align-content: flex-start; }
  .sm .tool { width: 74px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; }
  .sm .tool:active { box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top); }
  .sm .tool svg { width: 34px; height: 34px; }
  .pal { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; }
  .pal .pi { display: flex; align-items: center; gap: 8px; padding: 5px 8px; }
  .pal .pi.on { box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top); background: var(--field); }
  .pal .sw4 { display: grid; grid-template-columns: repeat(4, 12px); gap: 2px; }
  .pal .sw4 i { width: 12px; height: 12px; box-shadow: inset 1px 1px 0 rgba(255,255,255,.6), inset -1px -1px 0 rgba(0,0,0,.5); }
  .dlg-b { display: flex; justify-content: space-around; gap: 8px; padding: 8px; flex: none; box-shadow: inset 0 1px 0 var(--top), inset 0 2px 0 transparent; border-top: 1px solid var(--bot); }
  .btn { min-width: 76px; padding: 4px 12px; border: 0; background: var(--bg); box-shadow: inset 2px 2px 0 var(--top), inset -2px -2px 0 var(--bot); }
  .btn:active { box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top); }
  .btn.def { outline: 2px solid #000; outline-offset: 1px; }
  .pm { position: absolute; inset: 0; padding: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pm .g { display: flex; flex-direction: column; padding: 4px; }
  .pm .g b { font-size: 11px; display: flex; justify-content: space-between; }
  .pm canvas { flex: 1; width: 100%; min-height: 0; background: #0f1d22; margin-top: 3px; }
  .mail { position: absolute; inset: 0; display: grid; grid-template-rows: 40% 1fr; gap: 4px; padding: 4px; }
  .mail .list { overflow: auto; background: var(--field); }
  .mail .mr { display: grid; grid-template-columns: 14px 130px 1fr 90px; gap: 8px; padding: 2px 6px; white-space: nowrap; }
  .mail .mr span { overflow: hidden; text-overflow: ellipsis; }
  .mail .mr.sel { background: var(--sel); color: #fff; }
  .mail .mr.new { font-weight: 700; }
  .mail .read { background: #fff; padding: 8px 10px; overflow: auto; font: 12px/1.45 var(--mono); white-space: pre-wrap; user-select: text; box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top); }
  .helpv { position: absolute; inset: 2px; background: #fff; padding: 14px 18px; overflow: auto; font-size: 12.5px; line-height: 1.5; user-select: text; box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top); }
  .helpv h2 { margin: 0 0 4px; font-size: 17px; }
  .helpv h3 { margin: 14px 0 4px; font-size: 13px; color: var(--act-bot); text-transform: uppercase; letter-spacing: .04em; }
  .helpv ul { margin: 4px 0; padding-left: 18px; }
  .helpv li { margin: 2px 0; }
  .helpv code, .helpv kbd { font-family: var(--mono); font-size: 11.5px; }
  .am { position: absolute; inset: 0; margin: 2px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px 4px; padding: 8px; overflow: auto; background: var(--field); box-shadow: inset 2px 2px 0 var(--bot), inset -2px -2px 0 var(--top); }
  .dlg { display: flex; gap: 14px; padding: 16px; align-items: flex-start; flex: 1; }
  .dlg svg { width: 38px; height: 38px; flex: none; }
  #lock { position: fixed; inset: 0; background: #000; z-index: 2000000; display: none; color: #9ab; font: 13px var(--sys); }
  #lock.on { display: block; }
  #lock .msg { position: absolute; padding: 10px 16px; border: 1px solid #345; background: #050a10; text-align: center; transition: left 2s linear, top 2s linear; }
  #ended { position: fixed; inset: 0; background: #000; z-index: 2000001; display: none; color: #ccd; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font: 13px var(--sys); }
  #ended.on { display: flex; }
  #ended button { background: #222; color: #dde; border: 1px solid #555; padding: 6px 14px; font: inherit; cursor: pointer; }
  #toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 700000; padding: 6px 14px; display: none; }
  #toast.on { display: block; }
  /* ---------- the switch, and 2026 ---------- */
  .era { display: flex; flex-direction: column; justify-content: center; gap: 4px; margin: 0 3px 0 5px; }
  .era button { border: 0; background: var(--bg); box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot); font: 600 10px var(--mono); padding: 5px 6px; cursor: pointer; }
  .era button.on { box-shadow: inset 1px 1px 0 var(--bot), inset -1px -1px 0 var(--top); background: var(--field); }
  body.e26 { font-size: 13px; }
  body.e26 .win { padding: 4px; border-radius: 3px; box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot), 0 0 0 1px rgba(0,0,0,.55), 0 14px 34px rgba(0,0,0,.3); }
  body.e26 .win.act { box-shadow: inset 1px 1px 0 var(--act-top), inset -1px -1px 0 var(--act-bot), 0 0 0 1px rgba(0,0,0,.6), 0 18px 44px rgba(0,0,0,.42); }
  body.e26 .tb { height: 28px; }
  body.e26 .tb .b { width: 28px; height: 28px; box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot); }
  body.e26 .tb .t { font-size: 13px; box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot); }
  body.e26 .win.act .tb .b, body.e26 .win.act .tb .t { box-shadow: inset 1px 1px 0 var(--act-top), inset -1px -1px 0 var(--act-bot); }
  body.e26 .win.act .tb .t { background: linear-gradient(var(--act-top), var(--act) 65%); text-shadow: 0 1px 0 rgba(0,0,0,.3); }
  body.e26 .rz { box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot); }
  body.e26 .sk { box-shadow: inset 1px 1px 0 var(--bot), inset -1px -1px 0 var(--top); }
  body.e26 .menu { border-radius: 3px; box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot), 0 0 0 1px rgba(0,0,0,.45), 0 10px 26px rgba(0,0,0,.3); }
  body.e26 .menu .it { padding: 4px 12px 4px 20px; }
  body.e26 .menu .it.hot { box-shadow: none; background: var(--act); color: var(--act-ink); }
  body.e26 .menu .tear { display: none; }
  body.e26 #panel { bottom: 0; border-radius: 6px 6px 0 0; box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot), 0 0 0 1px rgba(0,0,0,.5), 0 -6px 24px rgba(0,0,0,.25); }
  body.e26 .sw { width: 300px; }
  body.e26 .wsb { height: 46px; flex-direction: column; gap: 2px; padding: 3px; font-size: 11px; }
  body.e26 .wsb .mini { width: 100%; flex: 1; position: relative; overflow: hidden; border: 1px solid rgba(0,0,0,.45); }
  body.e26 .wsb .mini i { position: absolute; background: var(--bg); border: 1px solid rgba(0,0,0,.6); }
  body.e26 .wsb .mini i.a { background: var(--act); }
  body.e26 .sub { border-radius: 4px; box-shadow: inset 1px 1px 0 var(--top), inset -1px -1px 0 var(--bot), 0 0 0 1px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.3); }
  .sub.wide { width: 300px; }
  .sbody { padding: 4px 4px 2px; }
  .sbody input[type=search] { width: 100%; border: 0; padding: 6px 8px; font: 13px var(--sys); background: #fff; color: #000; outline: none; }
  .sbody .res { margin-top: 4px; }
  .sbody .res .row small { margin-left: auto; color: #555; font-size: 10.5px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sbody .none { padding: 8px 6px; color: #444; }
  .sbody h4 { margin: 2px 4px 0; font-size: 15px; }
  .sbody .dt { margin: 0 4px 6px; color: #444; font-size: 11.5px; }
  .sbody .lbl { font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #444; margin: 8px 4px 3px; }
  .sbody .ap { display: flex; gap: 8px; padding: 2px 6px; }
  .sbody .ap b { font-family: var(--mono); font-weight: 600; width: 42px; }
  .sbody .nt { display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; padding: 4px 6px; }
  .sbody .nt svg { width: 26px; height: 26px; grid-row: span 2; }
  .sbody .nt small { color: #444; }
  .sbody .ctl { display: grid; grid-template-columns: 88px 1fr auto; align-items: center; gap: 8px; padding: 5px 6px; }
  .sbody .ctl input[type=range] { width: 100%; accent-color: var(--act); }
  .sbody .ctl small { color: #333; font-family: var(--mono); font-size: 11px; }
  .sbody .clr { display: flex; justify-content: flex-end; padding: 4px; }

function drag(w, e, how, sticky) {

  const el = w.el, r0 = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
  const sx = e ? e.clientX : r0.x + r0.w / 2, sy = e ? e.clientY : r0.y + 12;
  let lx = sx, ly = sy, snap = null;
  const o = document.createElement("div"); o.className = "outline";
  if (!live) document.body.appendChild(o);
  let r = { ...r0 };
  const px = q => ({ left: q.x + "px", top: q.y + "px", width: q.w + "px", height: q.h + "px" });
  const put = () => Object.assign(live ? el.style : o.style, px(r));
  const snapTo = k => {
    if (k === snap) return; snap = k;
    if (!k) { o.remove(); o.className = "outline"; return; }
    o.className = "outline snap"; Object.assign(o.style, px(snapRect(k))); document.body.appendChild(o);
  };
  put();
  const mv = ev => {
    lx = ev.clientX; ly = ev.clientY;
    const dx = ev.clientX - sx, dy = ev.clientY - sy; r = { ...r0 };
    if (how === "move") { r.x = r0.x + dx; r.y = clamp(r0.y + dy, 0, innerHeight - 30); }
    else {
      if (how.includes("e")) r.w = Math.max(180, r0.w + dx);
      if (how.includes("s")) r.h = Math.max(90, r0.h + dy);
      if (how.includes("w")) { r.w = Math.max(180, r0.w - dx); r.x = r0.x + r0.w - r.w; }
      if (how.includes("n")) { r.h = Math.max(90, r0.h - dy); r.y = r0.y + r0.h - r.h; }
    }
    if (live && how === "move") snapTo(lx <= 2 ? "left" : lx >= innerWidth - 3 ? "right" : ly <= 2 ? "full" : null);
    put();
  };
  const up = () => {
    removeEventListener("mousemove", mv); removeEventListener(sticky ? "mousedown" : "mouseup", up, true); o.remove();
    const hit = live && how === "move" && document.elementFromPoint(lx, ly);
    const wsb = hit && hit.closest && hit.closest(".wsb");
    if (wsb) {
      Object.assign(el.style, px(r0));
      w.ws = +wsb.dataset.i; show();
      toast(`“${w.title}” is in ${S.wsNames[w.ws]} now`);
      return;
    }
    if (snap) {
      w.saved = px(r0); Object.assign(el.style, px(snapRect(snap)));
    } else {
      Object.assign(el.style, px(r)); w.saved = null;
    }
    if (w.onResize) w.onResize(w);
    refreshMinis();
  };
  addEventListener("mousemove", mv);
  setTimeout(() => addEventListener(sticky ? "mousedown" : "mouseup", up, true), sticky ? 50 : 0);
}

// ---------- Terminal
function openTerm() {
  const st = { cwd: "/Home", hist: [], hi: 0, line: "" };
  makeWin({ app: "term", icon: "term", title: "Terminal", w: 600, h: 360, menus: [
    { t: "Window", items: [{ t: "New", a: () => launch("term") }, { t: "Close", a: () => closeWin(S.focus) }] },
    { t: "Edit", items: [{ t: "Copy", d: true }, { t: "Paste", d: true }] },
    { t: "Options", items: [{ t: "Menu Bar", chk: true, d: true }, { t: "Scroll Bar", chk: true, d: true }, { t: "Global…", d: true }] },
    { t: "Help", help: true, items: [{ t: "Overview…", a: () => launch("help") }, { t: "About Terminal", a: () => dialog({ title: "About Terminal", icon: "term", msg: "Terminal, in Corona's frame.<br><small>Kosmos's own Terminal would be here, and its shell is Kosmos's, not a Unix one.</small>" }) }] },
  ], init: w => {
    const t = document.createElement("div"); t.className = "term"; t.tabIndex = 0; w.body.appendChild(t);
    let out = `Kosmos 0.11.316 (Nebula) - Corona, workspace ${S.wsNames[S.ws]}\nType help for what this mockup answers.\n\n`;
    const prompt = () => `kosmos:${st.cwd}% `;
    const draw = () => { t.innerHTML = esc(out + prompt() + st.line) + `<span class="cur"> </span>`; t.scrollTop = t.scrollHeight; };
    const run = cmd => {
      const [c, ...a] = cmd.trim().split(/\s+/); const arg = a.join(" ");
      const res = p => p ? (p.startsWith("/") ? p : join(st.cwd, p)).replace(/\/\.$/, "") : st.cwd;
      switch (c) {
        case undefined: case "": return "";
        case "help": return "ls  cd  pwd  cat  uname  date  ps  who  prstat  echo  clear  open  exit\n";
        case "pwd": return st.cwd + "\n";
        case "ls": { const n = nodeAt(res(arg)); if (!n) return `ls: ${arg}: no such file\n`; if (!isDir(n)) return arg + "\n"; return Object.keys(n.kids).map(k => isDir(n.kids[k]) ? k + "/" : k).join("   ") + "\n"; }
        case "cd": { if (arg === "..") { st.cwd = parent(st.cwd); return ""; } const p = arg ? res(arg) : "/Home"; const n = nodeAt(p); if (!isDir(n)) return `cd: ${arg}: not a folder\n`; st.cwd = p; return ""; }
        case "cat": { const n = nodeAt(res(arg)); if (!n || isDir(n)) return `cat: ${arg}: no such file\n`; return n.bin ? `cat: ${arg}: not text\n` : n.text; }
        case "uname": return a[0] === "-a" ? "Kosmos kosmos 0.11.316 Nebula x86_64 4 processors\n" : "Kosmos\n";
        case "date": return new Date().toString() + "\n";
        case "who": return "diego    workspace " + S.wsNames[S.ws] + "\n";
        case "echo": return arg + "\n";
        case "clear": out = ""; return "";
        case "exit": closeWin(w); return "";
        case "open": { const n = nodeAt(res(arg)); if (!n) return `open: ${arg}: no such file\n`; isDir(n) ? openFiles(res(arg)) : openEditor(res(arg)); return ""; }
        case "ps": case "prstat": {
          const rows = [["1", "init", "0", "0.1"], ["2", "binfs", "0", "0.0"], ["3", "diskfs", "1", "0.4"], ["4", "net", "2", "0.2"], ["5", "audio", "3", "0.3"], ["6", "notify", "0", "0.0"], ["7", "wm", "1", "2.8"], ["8", "frontpanel", "2", "0.3"]];
          [...S.wins.values()].forEach((x, i) => rows.push([String(20 + i), x.app, String(i % 4), (Math.random() * 2).toFixed(1)]));
          return "  PID  PROGRAM          CPU   %\n" + rows.map(r => `${r[0].padStart(5)}  ${r[1].padEnd(16)} ${r[2].padStart(3)} ${r[3].padStart(4)}`).join("\n") + "\n\nEach in its own address space. A crash takes only itself.\n";
        }
        default: return `${c}: not found. Kosmos is not Unix; try help\n`;
      }
    };
    t.onkeydown = e => {
      if (e.metaKey || e.ctrlKey) return;
      e.preventDefault();
      if (e.key === "Enter") { const c = st.line; out += prompt() + c + "\n"; if (c.trim()) st.hist.push(c); st.hi = st.hist.length; st.line = ""; out += run(c); if (S.wins.has(w.id)) draw(); }

      else if (e.key === "ArrowUp") { if (st.hi > 0) st.line = st.hist[--st.hi]; draw(); }
      else if (e.key === "ArrowDown") { st.hi = Math.min(st.hist.length, st.hi + 1); st.line = st.hist[st.hi] || ""; draw(); }
      else if (e.key.length === 1) { st.line += e.key; draw(); }
    };
    w.body.onmousedown = () => setTimeout(() => t.focus());
    draw(); setTimeout(() => t.focus(), 30);
  } });
}

function clockSvg(big) {
  const d = new Date(), h = d.getHours() % 12 + d.getMinutes() / 60, m = d.getMinutes() + d.getSeconds() / 60, s = d.getSeconds();
  const hand = (a, l, wd, c) => { const r = (a - 90) * Math.PI / 180; return `<line x1="50" y1="50" x2="${50 + l * Math.cos(r)}" y2="${50 + l * Math.sin(r)}" stroke="${c}" stroke-width="${wd}" stroke-linecap="round"/>`; };
  let ticks = ""; for (let i = 0; i < 12; i++) { const r = i * 30 * Math.PI / 180; ticks += `<line x1="${50 + 38 * Math.sin(r)}" y1="${50 - 38 * Math.cos(r)}" x2="${50 + 43 * Math.sin(r)}" y2="${50 - 43 * Math.cos(r)}" stroke="#000" stroke-width="${i % 3 ? 1.5 : 3}"/>`; }
  return `<circle cx="50" cy="50" r="46" fill="#fff" stroke="#000" stroke-width="2"/>${ticks}${hand(h * 30, 24, 5, "#000")}${hand(m * 6, 36, 3.4, "#000")}${big ? hand(s * 6, 40, 1.2, "#a65d82") : ""}<circle cx="50" cy="50" r="3"/>`;
}

function openPerf() {
  makeWin({ key: "perf", app: "perf", icon: "perf", title: "Performance Meter", w: 440, h: 400, init: w => {
    const names = ["Processor 0", "Processor 1", "Processor 2", "Processor 3", "Memory", "Disk"];
    w.body.innerHTML = `<div class="pm">${names.map(n => `<div class="g rz"><b><span>${n}</span><span class="v"></span></b><canvas></canvas></div>`).join("")}</div>`;
    const hist = names.map(() => []); let base = [22, 14, 9, 30, 41, 5];
    const tick = () => {
      if (!S.wins.has(w.id)) return;
      const load = Math.min(40, S.wins.size * 4);
      $$(".g", w.body).forEach((g, i) => {
        const c = $("canvas", g), W = c.clientWidth, H = c.clientHeight; if (!W || !H) return;
        if (c.width !== W) { c.width = W; c.height = H; }
        base[i] = clamp(base[i] + (Math.random() - .5) * 18, 2, 95);
        const v = i === 4 ? clamp(30 + S.wins.size * 3, 0, 95) : clamp(base[i] * .7 + load * .5 + (Math.random() * 6), 0, 100);
        hist[i].push(v); if (hist[i].length > W / 3) hist[i].shift();
        $(".v", g).textContent = Math.round(v) + "%";
        const x = c.getContext("2d"); x.clearRect(0, 0, W, H);
        x.strokeStyle = "rgba(127,224,160,.18)"; for (let y = H / 4; y < H; y += H / 4) { x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }
        x.beginPath(); hist[i].forEach((h, j) => { const px = W - (hist[i].length - j) * 3, py = H - h / 100 * H; j ? x.lineTo(px, py) : x.moveTo(px, py); });
        x.strokeStyle = i === 4 ? "#ffcf4a" : "#7fe0a0"; x.lineWidth = 1.5; x.stroke();
      });
      setTimeout(tick, 500);
    };
    tick();
  } });
}

        <li><b>The Style Manager</b>: palettes chosen whole, a backdrop for each workspace, and whether the active window is the one you click or the one you point at.</li>
      </ul>
      <h3>From Kosmos</h3>
      <ul>
        <li>The applications are Kosmos's, in Motif's frame: in the real desktop, Kosmos's Terminal, Tracker and Write, not these stand-ins.</li>
        <li>The <b>Performance Meter</b> shows each of the four processors, because every one of them is in use.</li>
        <li>Every program in its own address space: <code>ps</code> in the Terminal says so.</li>
        <li>Exit ends the session; in Kosmos the desktop chooser would come back.</li>
      </ul>
      <h3>The switch: 1999 and 2026</h3>
      <ul>
        <li>At the Front Panel's right end. <b>1999</b> is CDE as Solaris drew it. <b>2026</b> keeps its manner and every part of it, reimagined for today's screens.</li>
      </ul>
      <h3>In 2026</h3>
      <ul>
        <li><b>The four buttons show their workspaces</b>, windows and all, drawn small. Drag a window by its title onto one to send it there.</li>
        <li><b>Every workspace at once</b>: F3. Click one to go to it. <kbd>Alt</kbd>+1 to 4, or <kbd>Alt</kbd>+arrows, slide between them.</li>
        <li><b>Windows move themselves</b> rather than an outline, and snap to half the screen at the left or right edge, or fill it at the top.</li>
        <li><b>Find</b>, in the Front Panel: applications and files, as you type.</li>
        <li><b>Today</b>, the subpanel above the calendar: the day's appointments and the notifications that came. Banners rise above the panel.</li>
        <li><b>Status</b>: the network, volume, brightness, the battery, and holding notifications until you say.</li>
        <li><b>Processors</b>: four bars in the panel, live. Click them for the Performance Meter.</li>
        <li><b>A palette for one workspace</b>: Style Manager, Color, "Only for workspace". And Night, a dark one.</li>
      </ul>
      <h3>Try</h3>
      <ul>
        <li>Open the Terminal from the subpanel above the editor, and type <code>ls</code>, <code>cat Documents/readme.txt</code>, <code>ps</code>.</li>
        <li>Put a window in every workspace: window menu, Occupy All Workspaces, then click Two.</li>
        <li>Style Manager, Color, and try Charcoal or Ocean.</li>
        <li>Click the padlock.</li>
        <li>Press F3. Then drag the Help Viewer onto Three.</li>
      </ul>
    </div>`;
  } });
}

/* ============================================================ the Front Panel */
const ARROW_UP = `<svg viewBox="0 0 11 8"><path d="M1 7L5.5 1 10 7z" fill="var(--top)" stroke="var(--bot)"/></svg>`;
const ARROW_DN = `<svg viewBox="0 0 11 8"><path d="M1 1L5.5 7 10 1z" fill="var(--bot)" stroke="var(--top)"/></svg>`;
const FPL = [
  { id: "clock", label: "", art: () => `<svg viewBox="0 0 100 100" class="fpclock">${clockSvg()}</svg>`, a: () => launch("clockapp"), sub: null },
  { id: "cal", label: "", art: () => calArt(), a: () => launch("cal"), sub: () => S.era === "2026" ? { t: "Today", wide: true, html: todayPanel } : null },
  { id: "files", label: "Home", art: () => ICO.files, a: () => launch("files"), sub: { t: "Files", items: [["files", "Home Folder"], ["trash", "Trash Can"]] } },
  { id: "editor", label: "Text Editor", art: () => ICO.editor, a: () => launch("editor"), sub: { t: "Personal Applications", items: [["term", "Terminal"], ["editor", "Text Editor"], ["perf", "Performance Meter"], ["web", "Web Browser"]] } },
  { id: "mail", label: "Mail", art: () => ICO.mail, a: () => launch("mail"), sub: { t: "Mail", items: [["mail", "Mailer"]] } },
  { id: "find", era: "2026", label: "Find", art: () => ICO.find, a: e => toggleSub(FPL.find(c => c.id === "find"), $("#fp-find")), sub: { t: "Find", wide: true, html: findPanel } },
  { id: "SWITCH" },
  { id: "printer", label: "Printer", art: () => ICO.printer, a: () => launch("printer"), sub: { t: "Personal Printers", items: [["printer", "Print Manager"]] } },
  { id: "style", label: "Style", art: () => ICO.style, a: () => launch("style"), sub: { t: "Tools", items: [["style", "Style Manager"], ["perf", "Performance Meter"]] } },
  { id: "apps", label: "Applications", art: () => ICO.apps, a: () => launch("apps"), sub: { t: "Applications", items: [["apps", "Application Manager"], ["term", "Terminal"], ["files", "File Manager"]] } },
  { id: "help", label: "Help", art: () => ICO.help, a: () => launch("help"), sub: { t: "Help", items: [["help", "Help Viewer"]] } },
  { id: "trash", label: "Trash", art: () => ICO.trash, a: () => launch("trash"), sub: null },
  { id: "meter", era: "2026", label: "Processors", art: () => `<canvas class="fpmeter" width="44" height="38"></canvas>`, a: () => launch("perf"), sub: null },
  { id: "status", era: "2026", label: "Status", art: () => ICO.status, a: e => toggleSub(FPL.find(c => c.id === "status"), $("#fp-status")), sub: { t: "Status", wide: true, html: statusPanel } },
];
function calArt() {
  const d = new Date();
  return `<svg viewBox="0 0 40 40"><rect x="5" y="4" width="30" height="32" fill="#fff" stroke="#000"/><rect x="5" y="4" width="30" height="9" fill="var(--act)" stroke="#000"/><text x="20" y="11.4" text-anchor="middle" font-family="IBM Plex Sans,Arial" font-size="7" font-weight="700" fill="#fff">${d.toLocaleDateString("en", { month: "short" }).toUpperCase()}</text><text x="20" y="31" text-anchor="middle" font-family="IBM Plex Sans,Arial" font-size="17" font-weight="700">${d.getDate()}</text></svg>`;
}
function buildPanel() {
  const p = $("#panel"); p.innerHTML = "";
  const hdl = side => { const h = document.createElement("div"); h.className = "hdl"; h.innerHTML = `<div class="hb rz1">${side === "l" ? '<i class="ic-menu" style="width:9px"></i>' : '<i class="ic-min"></i>'}</div><div class="bar"></div>`; return h; };
  const L = hdl("l"); p.appendChild(L);
  $(".hb", L).onmousedown = e => { e.stopPropagation(); openMenu([{ t: "Minimize", a: minPanel }, { t: "Move", d: true }, { t: "Lower", d: true }, { sep: true }, { t: "Restart Workspace Manager…", a: restartWm }], e.clientX, e.clientY - 120, { title: "Front Panel", noTear: true }); };
  FPL.filter(c => !c.era || c.era === S.era).forEach(c => {
    if (c.id === "SWITCH") { p.appendChild(buildSwitch()); return; }
    const sub = typeof c.sub === "function" ? c.sub() : c.sub;
    const d = document.createElement("div"); d.className = "fp"; d.id = "fp-" + c.id;
    d.innerHTML = `<div class="arr rz1${sub ? "" : " none"}">${ARROW_UP}</div><div class="cv rz" data-tip="${esc(c.label)}">${c.art()}${c.label ? `<small>${esc(c.label)}</small>` : ""}</div>`;
    $(".cv", d).onclick = e => { e.stopPropagation(); c.a(e); };
    if (sub) $(".arr", d).onclick = e => { e.stopPropagation(); toggleSub(c, d); };
    p.appendChild(d);
  });
  const era = document.createElement("div"); era.className = "era";
  era.innerHTML = `<button class="${S.era === "1999" ? "on" : ""}" title="Corona as Solaris drew it">1999</button><button class="${S.era === "2026" ? "on" : ""}" title="Corona reimagined">2026</button>`;
  const [b99, b26] = $$("button", era); b99.onclick = () => setEra("1999"); b26.onclick = () => setEra("2026");
  p.appendChild(era);
  const R = hdl("r"); p.appendChild(R);
  $(".hb", R).onclick = minPanel;
}
function buildSwitch() {
  const s = document.createElement("div"); s.className = "sw sk";
  s.innerHTML = `<div class="side"><div class="cv rz" id="lockb" title="Lock the display">${ICO.lock.replace('viewBox', 'width="26" height="26" viewBox')}</div><div class="busy-l"></div></div><div class="wsg">${S.wsNames.map((n, i) => `<div class="wsb rz" data-i="${i}" title="${S.era === "2026" ? "Drop a window here to send it to this workspace" : ""}">${wsLabel(i)}</div>`).join("")}</div><div class="side"><div class="cv rz" id="exitb" title="Exit">${ICO.exit.replace('viewBox', 'width="26" height="26" viewBox')}</div><small style="text-align:center;font-size:9.5px">Exit</small></div>`;
  $$(".wsb", s).forEach(b => {
    b.onclick = () => goWs(+b.dataset.i);
    b.ondblclick = () => {
      const i = +b.dataset.i; b.innerHTML = `<input value="${esc(S.wsNames[i])}" maxlength="12">`; const inp = $("input", b); inp.focus(); inp.select();
      const done = () => { S.wsNames[i] = inp.value.trim() || S.wsNames[i]; b.innerHTML = wsLabel(i); refreshMinis(); };
      inp.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") inp.blur(); if (e.key === "Escape") { inp.value = S.wsNames[i]; inp.blur(); } };
      inp.onblur = done; inp.onmousedown = e => e.stopPropagation();
    };
  });
  $("#lockb", s).onclick = lockScreen;
  $("#exitb", s).onclick = logout;
  return s;
}
let SUB = null;
function toggleSub(c, d) {
  const sub = typeof c.sub === "function" ? c.sub() : c.sub;
  if (!sub || !d) return;
  if (SUB && SUB.c === c) return closeSub();
  closeSub();
  const m = document.createElement("div"); m.className = "sub" + (sub.wide ? " wide" : "");
  m.innerHTML = `<div class="stb"><div class="b rz1"><i class="ic-menu" style="width:9px"></i></div><div class="t rz1">${esc(sub.t)}</div></div>` +
    (sub.html ? `<div class="sbody"></div>` : `<div class="inst sk">Install Icon</div>` +
      sub.items.map(([k, n]) => `<div class="row" data-k="${k}">${picOf(APPS[k].icon)}<span>${esc(n)}</span></div>`).join(""));
  document.body.appendChild(m);
  const r = d.getBoundingClientRect();
  const place = () => {
    m.style.left = clamp(r.left + r.width / 2 - m.offsetWidth / 2, 4, innerWidth - m.offsetWidth - 4) + "px";
    m.style.top = Math.max(4, r.top - m.offsetHeight + 2) + "px";
  };
  if (sub.html) sub.html($(".sbody", m), place);
  place();
  $$(".row[data-k]", m).forEach(x => x.onclick = () => { closeSub(); launch(x.dataset.k); });
  const inst = $(".inst", m); if (inst) inst.onclick = () => toast("Drop an application here to put it in this subpanel");
  $(".arr", d).innerHTML = ARROW_DN;
  SUB = { c, m, d };
}
function closeSub() { if (!SUB) return; SUB.m.remove(); const a = $(".arr", SUB.d); if (a) a.innerHTML = ARROW_UP; SUB = null; }

// ---------- 2026's subpanels
function findAll(q) {
  q = q.toLowerCase(); const out = [];
  Object.entries(APPS).forEach(([k, a]) => { if (a.name.toLowerCase().includes(q)) out.push({ t: a.name, ic: a.icon, where: "application", a: () => launch(k) }); });
  const walk = (n, p) => Object.entries(n.kids || {}).forEach(([k, c]) => {
    const cp = join(p, k);
    if (k.toLowerCase().includes(q)) out.push({ t: k, ic: isDir(c) ? "folder" : "doc", where: p, a: () => isDir(c) ? openFiles(cp) : c.bin ? toast(`${k} is not text`) : openEditor(cp) });
    walk(c, cp);
  });
  walk(FS, "/");
  return out.slice(0, 9);
}
function findPanel(b, place) {
  b.innerHTML = `<input type="search" class="sk" placeholder="Applications and files" spellcheck="false" autocomplete="off"><div class="res"></div>`;
  const inp = $("input", b), res = $(".res", b);
  inp.oninput = () => {
    const q = inp.value.trim(), f = q ? findAll(q) : [];
    res.innerHTML = q && !f.length ? `<div class="none">Nothing called “${esc(q)}”</div>` : f.map((x, i) => `<div class="row" data-i="${i}">${picOf(x.ic)}<span>${esc(x.t)}</span><small>${esc(x.where)}</small></div>`).join("");
    $$(".row", res).forEach(r => r.onclick = () => { closeSub(); f[+r.dataset.i].a(); });
    place();
  };
  inp.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") { const r = $(".row", res); if (r) r.click(); } if (e.key === "Escape") closeSub(); };
  setTimeout(() => inp.focus(), 20);
}
function todayPanel(b) {
  const d = new Date(), ap = APPTS[d.getDate()] || [], hm = x => x.toLocaleTimeString("en", { hour: "numeric", minute: "2-digit" });
  b.innerHTML = `<h4>${d.toLocaleDateString("en", { weekday: "long" })}</h4><div class="dt">${d.toLocaleDateString("en", { day: "numeric", month: "long", year: "numeric" })}${S.hold ? " · notifications held" : ""}</div>
    <div class="lbl">Appointments</div>${ap.length ? ap.map(a => `<div class="ap"><b>${a[0]}</b><span>${esc(a[1])}</span></div>`).join("") : `<div class="none">None today.</div>`}
    <div class="lbl">Notifications</div>${S.notes.length ? S.notes.map(n => `<div class="nt">${picOf(n.ic)}<b>${esc(n.t)} <small style="font-weight:400">${hm(n.at)}</small></b><small>${esc(n.b)}</small></div>`).join("") + `<div class="clr"><button class="btn">Clear</button></div>` : `<div class="none">Nothing has come today.</div>`}`;
  const c = $(".clr .btn", b); if (c) c.onclick = () => { S.notes = []; closeSub(); };
}
function statusPanel(b) {
  b.innerHTML = `<div class="ctl"><span>Network</span><span>Wired, 192.168.1.40</span><small>1 Gb/s</small></div>
    <div class="ctl"><span>Volume</span><input type="range" min="0" max="100" value="${S.vol}" class="v"><small class="vv">${S.vol}</small></div>
    <div class="ctl"><span>Brightness</span><input type="range" min="10" max="100" value="${S.bright}" class="br"><small class="bv">${S.bright}</small></div>
    <div class="ctl"><span>Battery</span><span>82%, charging</span><small>1:10</small></div>
    <div class="ctl"><span>Hold</span><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" class="hold" ${S.hold ? "checked" : ""}> notifications, until I say</label><small></small></div>`;
  $(".v", b).oninput = e => { S.vol = +e.target.value; $(".vv", b).textContent = S.vol; };
  $(".v", b).onchange = () => beep(660, .05);
  $(".br", b).oninput = e => { S.bright = +e.target.value; $(".bv", b).textContent = S.bright; document.body.style.filter = `brightness(${.55 + S.bright / 220})`; };
  $(".hold", b).onchange = e => { S.hold = e.target.checked; if (!S.hold && S.heldN) { banner({ t: "Corona", ic: "panel", b: `${S.heldN} notification${S.heldN === 1 ? "" : "s"} came while they were held. They are under the calendar.` }); S.heldN = 0; } };
}

// ---------- notifications: above the Front Panel in 2026; in 1999, the busy light only
function notify(ic, t, b) {
  const n = { ic, t, b, at: new Date() };
  S.notes.unshift(n); S.notes = S.notes.slice(0, 30);
  if (S.era !== "2026") { let k = 0; const l = $(".busy-l"); const iv = setInterval(() => { if (l) l.classList.toggle("on"); if (++k === 6) clearInterval(iv); }, 220); return; }
  if (S.hold) { S.heldN = (S.heldN || 0) + 1; return; }
  banner(n);
}
function banner(n) {
  const box = $("#banners"), d = document.createElement("div");
  d.className = "banner"; d.innerHTML = `${picOf(n.ic)}<b>${esc(n.t)}</b><span>${esc(n.b)}</span>`;
  d.onclick = () => d.remove();
  box.prepend(d); while (box.children.length > 3) box.lastChild.remove();
  box.style.bottom = (S.panelMin ? 14 : $("#panel").offsetHeight + 14) + "px";
  setTimeout(() => d.remove(), 5500);
  beep(1320, .04);
}
// The panel's meter: the four processors, live.
const METER = [20, 12, 30, 8];
setInterval(() => {
  const c = $(".fpmeter"); if (!c) return;
  const x = c.getContext("2d"); x.clearRect(0, 0, 44, 38); x.fillStyle = "#0f1d22"; x.fillRect(0, 0, 44, 38);
  METER.forEach((v, i) => { METER[i] = clamp(v + (Math.random() - .5) * 22 + S.wins.size * .4, 3, 96); const h = METER[i] / 100 * 32; x.fillStyle = METER[i] > 75 ? "#ffcf4a" : "#7fe0a0"; x.fillRect(4 + i * 10, 35 - h, 7, h); });
}, 600);
// Things that happen while the mockup is open.
setTimeout(() => { MAIL.unshift({ f: "Ana", s: "Corona!", d: "Today", n: true, b: "You put the four buttons back. Can workspace Two be mine?\n\n- A\n" }); S.wins.forEach(w => { if (w.app === "mail") { closeWin(w); openMail(); } }); notify("mail", "Mail from Ana", "Corona!"); }, 22000);
setTimeout(() => notify("apps", "Three updates are ready", "They go in at the next restart. Nothing has to quit for it now."), 48000);

function setEra(e) {
  S.era = e; document.body.classList.toggle("e26", e === "2026");
  closeSub(); closeMenus(); endOverview();
  buildPanel(); show();
  if (e !== "2026") document.body.style.filter = "";
  toast(e === "2026" ? "2026: Corona reimagined" : "1999: Corona as Solaris drew it");
}
function minPanel() {
  closeSub(); $("#panel").style.display = "none"; S.panelMin = true;
  const ic = document.createElement("div"); ic.className = "dicon"; ic.id = "panelicon";
  ic.innerHTML = `<div class="p rz">${ICO.panel}</div><div class="l">Front Panel</div>`;
  Object.assign(ic.style, { left: "8px", bottom: "8px", top: "auto" });
  ic.ondblclick = restorePanel; document.body.appendChild(ic);
}
function restorePanel() { const ic = $("#panelicon"); if (ic) ic.remove(); $("#panel").style.display = ""; S.panelMin = false; }
function restartWm() {
  dialog({ title: "Workspace Manager", icon: "q", msg: "Restart the Workspace Manager?<br><small>In Kosmos the window manager is one process for every desktop; the panel and workspaces would start again, and every application would keep running.</small>", buttons: [{ t: "OK", def: true, a: () => { document.body.style.opacity = .2; setTimeout(() => { document.body.style.opacity = ""; buildPanel(); show(); toast("The Workspace Manager started again"); }, 500); } }, { t: "Cancel" }] });
}

/* ============================================================ the workspace menu, the lock, the end */
function workspaceMenu(x, y) {
  openMenu([
    { t: "Programs", sub: [["term", "Terminal"], ["files", "File Manager"], ["editor", "Text Editor"], ["mail", "Mailer"], ["cal", "Calendar"], ["perf", "Performance Meter"], ["style", "Style Manager"], ["help", "Help Viewer"]].map(([k, t]) => ({ t, a: () => launch(k) })) },
    { sep: true },
    { t: "Shuffle Up", a: () => shuffle(1) },
    { t: "Shuffle Down", a: () => shuffle(-1) },
    { t: "Refresh", a: () => { document.body.style.visibility = "hidden"; setTimeout(() => document.body.style.visibility = "", 80); } },
    { t: S.panelMin ? "Restore Front Panel" : "Minimize Front Panel", a: () => S.panelMin ? restorePanel() : minPanel() },
    { sep: true },
    { t: "Restart Workspace Manager…", a: restartWm },
    { sep: true },
    { t: "Log out…", a: logout },
  ], x, y, { title: "Workspace Menu" });
}
function shuffle(dir) {
  const ws = [...S.wins.values()].filter(visible).sort((a, b) => +a.el.style.zIndex - +b.el.style.zIndex);
  if (ws.length < 2) return;
  if (dir > 0) focusWin(ws[0]); else lower(ws[ws.length - 1]);
}
function lockScreen() {
  const L = $("#lock"); L.classList.add("on");
  const m = $(".msg", L);
  const mv = () => { if (!L.classList.contains("on")) return; m.style.left = (Math.random() * (innerWidth - 300)) + "px"; m.style.top = (Math.random() * (innerHeight - 80)) + "px"; setTimeout(mv, 2200); };
  m.style.left = (innerWidth / 2 - 150) + "px"; m.style.top = (innerHeight / 2 - 30) + "px"; setTimeout(mv, 1500);
  L.onclick = () => L.classList.remove("on");
}
function logout() {
  dialog({ title: "Logout Confirmation", icon: "exit", msg: "Continue logout?<br><small>Every application is asked to quit. One with a document unsaved asks its own question.</small>", buttons: [{ t: "OK", def: true, a: () => { [...S.wins.values()].forEach(w => { w.el.remove(); }); S.wins.clear(); $$(".dicon").forEach(x => x.remove()); $("#ended").classList.add("on"); } }, { t: "Cancel" }] });
}
$("#again").onclick = () => { $("#ended").classList.remove("on"); startSession(); };

$("#desk").addEventListener("mousedown", e => { if (e.target.id === "desk") { $$(".dicon").forEach(x => x.classList.remove("sel")); if (!S.pointerFocus) focusWin(null); } });
document.addEventListener("contextmenu", e => { if (e.target.id === "desk" || e.target === document.body) { e.preventDefault(); workspaceMenu(e.clientX, e.clientY); } });

/* ============================================================ the clock ticks */
setInterval(() => {
  const c = $(".fpclock"); if (c) c.innerHTML = clockSvg();
  $$(".bigclock").forEach(b => b.innerHTML = clockSvg(true));
}, 1000);

function startSession() {
  S.ws = 0; document.body.classList.toggle("e26", S.era === "2026"); buildPanel(); show();
  // What a session comes back to: the File Manager in One, the Help Viewer over it.
  const go = () => { openFiles("/Home"); setTimeout(() => openHelp(), 60); };
  // A page opened in a hidden tab has no size yet; wait until it has one.
  if (innerWidth > 0) go(); else addEventListener("resize", function once() { if (innerWidth > 0) { removeEventListener("resize", once); go(); } });
}
startSession();
</script>
