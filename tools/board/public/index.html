<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kosmos Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* The Kosmos Board, as drawn (https://claude.ai/artifact/DWT7DQk8hqQv6vJnrXDpiW,
   agreed 9 October 2026): Kosmos's Night look, IBM Plex, one page with five
   views - Discussions, Board, Queue, Decisions, API - over the board's API. */
:root {
  --ground: #0d121a; --bar: #121925; --card: #151c27; --raised: #1e2636; --line: #263142; --line2: #2b3548;
  --ink: #e6edf3; --soft: #c9d3e0; --dim: #98a4b5; --accent: #a8c7fa; --on: #0a1b38;
  --claude: #3a5ba0; --claude-ground: #142033; --claude-line: #2b4266; --diego: #0f5c4d;
  --amber: #f0b65a; --amber-ground: #2a2412; --amber-line: #5c4a1c; --green: #8fcf86; --pink: #e58fb0;
  --c-ideas: #f0b65a; --c-agreed: #b9a5ff; --c-next: #5fd0bd; --c-building: #8fb4ff; --c-done: #8fcf86; --c-parked: #d7a3b5;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.45 var(--body); }
body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom, 0px); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.btn { height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--bar); display: inline-flex; align-items: center; gap: 6px; }
.btn.go { background: var(--accent); color: var(--on); border-color: transparent; font-weight: 600; }
.btn.done { background: var(--green); color: #0d1f0b; border-color: transparent; font-weight: 600; }
.btn.quiet { background: transparent; color: var(--dim); }
.btn.claude { background: var(--claude-ground); border-color: var(--claude-line); }
.field { height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--ground); padding: 0 10px; min-width: 0; }
textarea.field { height: auto; padding: 8px 10px; resize: vertical; width: 100%; }
.label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.pill { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.badge { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
.empty { color: var(--dim); padding: 18px; border: 1px dashed var(--line); border-radius: 12px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bar); }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on); display: grid; place-items: center; font: 600 17px var(--display); }
.name { font: 600 20px var(--display); }
nav.views { display: flex; gap: 4px; flex-wrap: wrap; }
nav.views button { padding: 7px 12px; border-radius: 8px; border: 0; background: transparent; color: var(--dim); }
nav.views button[aria-current="page"] { background: var(--raised); color: var(--ink); font-weight: 500; }
.search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--ground); color: var(--dim); min-width: 0; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; }
.me { display: flex; gap: 6px; align-items: center; }
.needsyou { height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--amber); color: var(--on); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.needlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.needlist li button { width: 100%; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; align-items: baseline; text-align: left; padding: 12px 14px; border-radius: 12px; background: var(--amber-ground); border: 1px solid var(--amber-line); }
.needlist .kind { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--amber); }

/* Claude's strip */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 12px 20px 0; padding: 11px 14px; border-radius: 12px; background: var(--claude-ground); border: 1px solid var(--claude-line); }
.strip .who { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.strip .live { position: relative; }
.strip .live::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--state, #5fd0bd); border: 2px solid var(--claude-ground); }
.strip .on { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--claude-line); text-underline-offset: 3px; text-align: left; }
.strip .step { color: var(--soft); }
.strip .wait { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
.strip .next { color: var(--soft); font-size: 13px; border: 0; border-left: 1px solid var(--claude-line); padding: 0 0 0 14px; background: none; text-align: left; }
.strip .since { margin-left: auto; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
.strip ol { flex-basis: 100%; margin: 4px 0 0; padding: 10px 0 0; border-top: 1px solid var(--claude-line); list-style: none; display: flex; flex-direction: column; gap: 5px; }
.strip li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.strip li time { color: var(--dim); font-family: var(--mono); }

/* the board */
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bar); font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--raised); }
.chip .n { color: var(--dim); font-variant-numeric: tabular-nums; }
.boardwrap { display: flex; flex-wrap: wrap; gap: 18px; padding: 4px 20px 28px; align-items: flex-start; }
/* The board fits the window: each column scrolls its own cards, and the
   columns scroll sideways under a bar that is always shown (a Mac hides an
   overlay scroll bar until it is used, and at the foot of the longest
   column it was 143 cards down). --above is measured when drawn. */
.columns { flex: 999 1 760px; min-width: 0; overflow-x: scroll; overflow-y: hidden; padding-bottom: 6px;
  height: calc(100dvh - var(--above, 260px) - 16px); min-height: 360px;
  scrollbar-color: #4a5770 var(--bar); }
.columns::-webkit-scrollbar { height: 14px; }
.columns::-webkit-scrollbar-track { background: var(--bar); border-radius: 7px; }
.columns::-webkit-scrollbar-thumb { background: #4a5770; border-radius: 7px; border: 3px solid var(--bar); }
.columns::-webkit-scrollbar-thumb:hover { background: #6a7a96; }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: 272px; gap: 14px; height: 100%; }
.col { background: var(--bar); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
.col .list { flex: 1 1 auto; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #3a4558 transparent; }
.col.over { border-color: var(--accent); }
.colhead { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; }
.colhead h2 { margin: 0; font: 600 16px var(--display); letter-spacing: .02em; }
.colhead .n { color: var(--dim); font-size: 12px; }
.colhead .hint { margin-left: auto; color: var(--dim); font-size: 12px; }
.list { display: flex; flex-direction: column; gap: 8px; padding: 0 10px 12px; min-height: 60px; }
.cardbox { display: flex; flex-direction: column; gap: 7px; width: 100%; text-align: left; padding: 11px 12px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line2); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.cardbox.chosen { border-color: var(--accent); }
.cardbox .top { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim); }
.cardbox .place { margin-left: auto; font: 500 11px var(--mono); color: var(--ink); background: var(--card); border-radius: 6px; padding: 1px 6px; }
.cardbox .title { font-weight: 600; font-size: 14px; line-height: 1.35; }
.cardbox .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 11.5px; color: var(--dim); }
.cardbox .ref { font-family: var(--mono); }
.here { display: inline-flex; align-items: center; gap: 5px; color: var(--on); background: #8fb4ff; border-radius: 999px; padding: 1px 8px; font-weight: 600; }
.needs { color: var(--on); background: var(--amber); border-radius: 999px; padding: 1px 8px; font-weight: 600; }
.ghost { position: fixed; z-index: 100; pointer-events: none; transform: rotate(2deg); box-shadow: 0 14px 30px rgba(0,0,0,.45); opacity: .95; }
.placeholder { border: 2px dashed var(--accent); border-radius: 10px; background: transparent; }
.more { border: 1px dashed var(--line); background: transparent; color: var(--dim); border-radius: 10px; padding: 9px; }
.addcard { border: 0; background: transparent; color: var(--dim); text-align: left; padding: 6px 4px; }
.coltabs { display: none; gap: 6px; padding: 0 20px 10px; overflow-x: auto; }
.coltabs button { flex: none; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bar); font-size: 13px; }
.coltabs button[aria-selected="true"] { border-color: var(--accent); background: var(--raised); }
.coltabs button.over { border-color: var(--accent); background: var(--claude-ground); }

/* a card, opened */
.boardwrap { padding-bottom: 12px !important; }
.panel { flex: 1 1 340px; max-width: 440px; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }
.panel h3 { margin: 0; }
.panel .titlefield { font: 600 21px/1.2 var(--display); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 2px 4px; width: 100%; }
.panel .titlefield:hover, .panel .titlefield:focus { border-color: var(--line); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid2 label, .stack label { display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
.quote { margin: 0; padding-left: 12px; border-left: 3px solid var(--accent); color: var(--dim); font-style: italic; }
.decide { background: var(--amber-ground); border: 1px solid var(--amber-line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.decide .q { font-weight: 600; color: var(--amber); }
.decide .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.decide .opts button { border: 1px solid var(--amber-line); background: var(--card); border-radius: 8px; padding: 6px 10px; }
.thread { display: flex; flex-direction: column; gap: 10px; }
.msg { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.bubble { line-height: 1.5; padding: 9px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); overflow-wrap: anywhere; white-space: pre-wrap; }
.bubble.c { background: var(--claude-ground); border-color: var(--claude-line); }
.bubble .by { color: var(--dim); font-size: 12px; display: block; white-space: normal; }
.bubble .asks { color: var(--amber); font-size: 12px; }
.files { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.file { display: flex; flex-direction: column; gap: 4px; border: 0; background: none; padding: 0; text-align: left; }
.file .thumb { height: 92px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised) center / cover no-repeat; display: grid; place-items: end start; padding: 6px 8px; font: 500 11px var(--mono); color: var(--dim); }
.file .cap { font-size: 12.5px; line-height: 1.35; }
.file .by { font-size: 11.5px; color: var(--dim); }
.dropzone.over { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 12px; }
.history { font-size: 12.5px; color: var(--dim); display: flex; flex-direction: column; gap: 3px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

/* queue, discussions, decisions */
main.page { max-width: 1000px; margin: 0 auto; padding: 22px 20px 40px; display: flex; flex-direction: column; gap: 18px; }
main.wide { max-width: 1440px; }
h1.h { margin: 0; font: 600 28px var(--display); }
h2.h { margin: 0; font: 600 18px var(--display); }
.sub { color: var(--dim); }
.nowcard { background: var(--claude-ground); border: 1px solid var(--claude-line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.qlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.qitem { display: grid; grid-template-columns: 26px 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; user-select: none; -webkit-user-select: none; }
.qitem .grip { color: #4a5770; cursor: grab; font-size: 18px; text-align: center; touch-action: none; }
.qitem .place { font: 600 15px var(--mono); color: var(--dim); text-align: center; }
.qitem .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.qitem .acts button { height: 34px; min-width: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bar); font-size: 13px; }
.split { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.dlist { flex: 1 1 300px; max-width: 360px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.ditem { display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); text-align: left; }
.ditem.chosen { border-color: var(--accent); }
.dmain { flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.box.c { background: var(--claude-ground); border-color: var(--claude-line); }
.box.open { background: var(--amber-ground); border-color: var(--amber-line); }
.opt { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.opt.rec { border-color: var(--claude-line); }
.opt.chosen { border-color: var(--green); }
.plus { color: var(--green); font-size: 13px; }
.minus { color: var(--pink); font-size: 13px; }
table.dec { width: 100%; min-width: 720px; border-collapse: collapse; background: var(--bar); }
table.dec th { text-align: left; padding: 10px 14px; font-weight: 500; color: var(--dim); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
table.dec td { padding: 12px 14px; border-top: 1px solid var(--line); vertical-align: top; }
.scrollx { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
.sheet { position: fixed; inset: 0; z-index: 60; background: rgba(5, 8, 12, .7); display: grid; place-items: center; padding: 16px; }
.sheet form { width: min(520px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; z-index: 80; max-width: calc(100% - 32px); }
.gate { max-width: 420px; margin: 12vh auto; padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; gap: 12px; }

@media (max-width: 760px) {
  header.top { padding: 10px 14px; }
  .strip, .chips, .boardwrap { margin-left: 0; margin-right: 0; }
  .strip { margin: 10px 14px 0; }
  .chips { padding: 10px 14px; }
  .boardwrap { padding: 4px 14px 24px; }
  .coltabs { display: flex; padding: 0 14px 10px; }
  .columns { height: auto; overflow: visible; }
  .cols { grid-auto-flow: row; grid-auto-columns: auto; height: auto; }
  .col .list { overflow: visible; }
  .col { display: none; min-height: 0; }
  .col.shown { display: flex; }
  .panel { position: fixed; inset: auto 0 0 0; max-width: none; max-height: 82vh; border-radius: 16px 16px 0 0; z-index: 40; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
  .qitem { grid-template-columns: 22px 24px minmax(0, 1fr); }
  .qitem .acts { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (prefers-reduced-motion: no-preference) { .chip, .btn, .cardbox { transition: border-color .12s, background .12s; } }
</style>

<body>
<div id="app"></div>
<script>
"use strict";

// ---- Talking to the API ----------------------------------------------

const KEY_STORE = "kosmos-board-key";
let KEY = null;
try { KEY = localStorage.getItem(KEY_STORE); } catch (e) {}

async function api(path, opts = {}) {
  const headers = Object.assign({ Authorization: "Bearer " + KEY }, opts.headers || {});
  let body = opts.body;
  if (body !== undefined && !(body instanceof Blob) && !(body instanceof ArrayBuffer)) {
    headers["Content-Type"] = "application/json";
    body = JSON.stringify(body);
  }
  const r = await fetch(path, { method: opts.method || "GET", headers, body });
  if (r.status === 401) { forgetKey(); throw new Error("the key was refused"); }
  const kind = r.headers.get("content-type") || "";
  const data = kind.includes("application/json") ? await r.json() : await r.blob();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function forgetKey() {
  KEY = null;
  try { localStorage.removeItem(KEY_STORE); } catch (e) {}
  render();
}

// ---- What the page knows ------------------------------------------------

const COLUMNS = [
  ["ideas", "Ideas", "asked, not agreed"], ["agreed", "Agreed", ""], ["next", "Next", "Claude's queue"],
  ["building", "Building", "now"], ["done", "Done", ""], ["parked", "Parked", "held"],
];
const COLNAME = Object.fromEntries(COLUMNS.map(([k, n]) => [k, n]));
const STAGES = [["open", "Open", "#f0b65a"], ["shaping", "Shaping", "#5fd0bd"], ["ready", "Ready", "#8fb4ff"], ["became", "Became cards", "#8fcf86"], ["parked", "Parked", "#d7a3b5"]];
const AREA_COLOURS = ["#a8c7fa", "#b9a5ff", "#5fd0bd", "#f0b65a", "#8fb4ff", "#e58fb0", "#a3adbf", "#8fcf86", "#d7a3b5", "#f2a37a"];

const S = {
  view: "board", me: null, cards: [], queue: [], now: null, discussions: [], decisions: [], waiting: null,
  today: [], area: "", query: "", chosen: null, detail: null, discussion: null, discussionDetail: null,
  stage: "", tab: "next", feedOpen: false, doneShown: 30, thumbs: {}, lastChange: null,
};
try { const v = localStorage.getItem("kosmos-board-view"); if (v) S.view = v; } catch (e) {}

function areaColour(area) {
  let h = 0;
  for (const ch of area || "") h = (h * 31 + ch.charCodeAt(0)) % 997;
  return AREA_COLOURS[h % AREA_COLOURS.length];
}

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) n.append(k);
  return n;
}

function badge(who) {
  return el("span", { class: "badge", style: "background:" + (who === "Claude" ? "var(--claude)" : "var(--diego)"), title: who, text: (who || "?")[0] });
}

const clip = () => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("width", "12"); s.setAttribute("height", "12"); s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "2"); s.setAttribute("aria-hidden", "true");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", "m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5");
  s.append(p);
  return s;
};

function when(iso) {
  if (!iso) return "";
  const d = new Date(iso), n = new Date();
  const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === n.toDateString()) return hm;
  return d.toLocaleDateString([], { day: "numeric", month: "short" }) + ", " + hm;
}

function minutes(fromIso) {
  if (!fromIso) return "";
  const m = Math.max(0, Math.round((Date.now() - new Date(fromIso)) / 60000));
  return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + (m % 60) + " min";
}

let toastTimer = null;
function toast(text) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = el("div", { class: "toast", role: "status", text });
  document.body.append(t);
  clearTimeout(toastTimer);

// ---- Loading --------------------------------------------------------------

async function load() {
  const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  const [cards, queue, now, discussions, decisions, waiting, today] = await Promise.all([
    api("/api/cards"), api("/api/queue"), api("/api/now"), api("/api/discussions"),
    api("/api/decisions"), api("/api/waiting"), api("/api/changes?since=" + midnight.toISOString()),
  ]);
  S.cards = cards.cards; S.queue = queue.queue; S.now = now.now; S.discussions = discussions.discussions;
  S.decisions = decisions.decisions; S.waiting = waiting;
  S.today = today.changes.filter((c) => c.author === "Claude" && c.kind !== "now").reverse().slice(0, 20);
  S.lastChange = today.now;
  if (S.chosen) S.detail = await api("/api/cards/" + encodeURIComponent(S.chosen)).catch(() => null);
  if (S.discussion) S.discussionDetail = await api("/api/discussions/" + S.discussion).catch(() => null);
}

// Every fifteen seconds, what changed - from Claude, from another device.
async function poll() {
  if (!KEY || document.hidden || dragging) return;
  try {
    const c = await api("/api/changes?since=" + encodeURIComponent(S.lastChange || new Date().toISOString()));
    S.lastChange = c.now;
    if (c.changes.length) { await load(); render(); }
  } catch (e) {}
}
setInterval(poll, 15000);
window.addEventListener("resize", () => {
  const c = document.querySelector(".columns");
  if (c) document.documentElement.style.setProperty("--above", Math.round(c.getBoundingClientRect().top + window.scrollY) + "px");

document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

function sentence(c) {
  const d = c.data || {};
  const t = c.card ? "“" + titleOf(c.card) + "”" : "";
  switch (c.kind) {
    case "card.new": return "Made " + t;
    case "card.move": return "Moved " + t + " to " + (COLNAME[d.to] || d.to);
    case "card.edit": return "Changed " + t;
    case "card.remove": return "Removed “" + (d.title || c.card) + "”";
    case "note": return (d.asks ? "Asked on " : "Wrote on ") + t + ": " + (d.text || "").slice(0, 120);
    case "file": return "Added " + (d.name || "a file") + (t ? " to " + t : "") + (d.caption ? ": " + d.caption : "");
    case "queue.take": return "Took " + (t || d.task || "the next task") + " from the queue";
    case "queue.add": return "Queued " + (t || d.task || "a task");
    case "queue.remove": return "Took " + (t || d.task || "a task") + " out of the queue";
    case "decision.new": return "Asked you: " + (d.question || "");
    case "decision.answer": return "Recorded your decision: " + (d.answer || "");
    case "discussion.new": return "Started a discussion: " + (d.title || "");
    case "message": return "Wrote in a discussion: " + (d.text || "").slice(0, 120);
    case "discussion.card": return "Made " + t + " from a discussion";
    default: return c.kind;
  }
}

// ---- Dragging cards and queue entries ---------------------------------------
// One way for a mouse and a finger: pointer events. A mouse drags after it
// moves five pixels; a finger after it rests on the card a third of a second,
// so a swipe still scrolls.

let dragging = null, justDragged = false;

function startDrag(e, node, kind) {
  const rect = node.getBoundingClientRect();
  const ghost = node.cloneNode(true);
  ghost.classList.add("ghost");
  ghost.style.width = rect.width + "px";
  ghost.style.left = rect.left + "px";
  ghost.style.top = rect.top + "px";
  document.body.append(ghost);
  const ph = el("div", { class: "placeholder", style: "height:" + rect.height + "px" });
  node.after(ph);
  node.hidden = true;
  dragging = { kind, node, ghost, ph, dx: e.clientX - rect.left, dy: e.clientY - rect.top, pointer: e.pointerId };
}

function dragMove(e) {
  const d = dragging;
  d.ghost.style.left = e.clientX - d.dx + "px";
  d.ghost.style.top = e.clientY - d.dy + "px";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  document.querySelectorAll(".col.over, .coltabs button.over").forEach((n) => n.classList.remove("over"));
  if (d.kind === "card") {
    const tab = under && under.closest(".coltabs button");
    if (tab) { tab.classList.add("over"); d.tab = tab.dataset.col; return; }
    d.tab = null;
    const list = under && under.closest(".list");
    if (!list) return;
    list.closest(".col").classList.add("over");
    const lr = list.getBoundingClientRect();
    if (e.clientY > lr.bottom - 40) list.scrollTop += 14;
    if (e.clientY < lr.top + 40) list.scrollTop -= 14;
    placeAmong(list, ".cardbox:not([hidden])", e.clientY, list.querySelector(".more, .addcard"));
  } else {
    const list = document.querySelector(".qlist");
    if (list) placeAmong(list, ".qitem:not([hidden])", e.clientY, null);
  }
  // Near the edge of the columns, they scroll.
  const cols = document.querySelector(".columns");
  if (cols && d.kind === "card") {
    const r = cols.getBoundingClientRect();
    if (e.clientX > r.right - 50) cols.scrollLeft += 18;
    if (e.clientX < r.left + 50) cols.scrollLeft -= 18;
  }
}

function placeAmong(list, selector, y, tail) {
  const items = [...list.querySelectorAll(selector)];
  const after = items.find((n) => { const r = n.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if (after) after.before(dragging.ph);
  else if (tail) tail.before(dragging.ph);
  else list.append(dragging.ph);
}

async function endDrag() {
  const d = dragging;
  dragging = null;
  d.ghost.remove();
  document.querySelectorAll(".col.over, .coltabs button.over").forEach((n) => n.classList.remove("over"));
  justDragged = true;
  setTimeout(() => { justDragged = false; }, 50);
  if (d.kind === "card") {
    const id = d.node.dataset.id;
    if (d.tab) { d.ph.remove(); d.node.hidden = false; await moveCard(id, d.tab, null); return; }
    const list = d.ph.closest(".list");
    if (!list) { d.ph.remove(); d.node.hidden = false; return; }
    let next = d.ph.nextElementSibling;
    while (next && !(next.classList.contains("cardbox") && !next.hidden)) next = next.nextElementSibling;
    d.ph.replaceWith(d.node);
    d.node.hidden = false;
    const before = next ? next.dataset.id : null;
    const col = list.dataset.col;
    if (col === d.node.dataset.col && before === nextCardId(d.node)) return;
    await moveCard(id, col, before);
  } else {
    let next = d.ph.nextElementSibling;
    while (next && !(next.classList.contains("qitem") && !next.hidden)) next = next.nextElementSibling;
    d.ph.replaceWith(d.node);
    d.node.hidden = false;
    const id = Number(d.node.dataset.entry);
    await attempt("Not moved", async () => {
      await api("/api/queue/" + id + "/move", { method: "POST", body: next ? { before: Number(next.dataset.entry) } : {} });
      await load(); renderMain();
    });
  }
}

function nextCardId(node) {
  const c = S.cards.find((x) => x.id === node.dataset.id);
  if (!c) return null;
  const same = S.cards.filter((x) => x.col === c.col);
  const i = same.indexOf(c);
  return same[i + 1] ? same[i + 1].id : null;
}

document.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || dragging) return;
  const card = e.target.closest(".cardbox");
  const grip = e.target.closest(".qitem .grip");
  const node = card || (grip && grip.closest(".qitem"));
  if (!node) return;
  const kind = card ? "card" : "queue";
  const start = { x: e.clientX, y: e.clientY };
  let timer = null, began = false;
  const begin = (ev) => { if (began) return; began = true; startDrag(ev, node, kind); };
  if (e.pointerType !== "mouse") timer = setTimeout(() => { begin(e); if (navigator.vibrate) navigator.vibrate(10); }, kind === "card" ? 330 : 0);
  const move = (ev) => {
    if (!began) {
      if (e.pointerType === "mouse" && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) > 5) begin(ev);
      else if (e.pointerType !== "mouse" && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) > 10) { clearTimeout(timer); cleanup(); return; }
      if (!began) return;
    }
    ev.preventDefault();
    dragMove(ev);
  };
  const up = () => { clearTimeout(timer); cleanup(); if (began && dragging) endDrag(); };
  const cleanup = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up); };
  window.addEventListener("pointermove", move, { passive: false });
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
});
document.addEventListener("touchmove", (e) => { if (dragging) e.preventDefault(); }, { passive: false });

      el("span", { style: "font-weight:600;font-size:16px", text: x.question }),
      el("div", { class: "opts" }, x.options.map((o) => el("button", { type: "button", onclick: () => answer(x.id, o) }, o)),
        el("button", { type: "button", onclick: () => answerSheet(x) }, "In my own words")))))
      : el("p", { class: "empty", text: "Nothing is waiting for you." }),
    el("div", { class: "row", style: "align-items:baseline;gap:12px" }, el("h2", { class: "h", text: "Decided" }), el("span", { class: "sub", text: "Each with your words. Newest first." })),
    el("div", { class: "scrollx" }, el("table", { class: "dec" },
      el("thead", {}, el("tr", {}, el("th", { text: "When" }), el("th", { text: "Decision" }), el("th", { text: "In your words" }), el("th", { text: "Card" }))),
      el("tbody", {}, done.map((x) => el("tr", {},
        el("td", { style: "font-family:var(--mono);font-size:12.5px;color:var(--dim);white-space:nowrap", text: (x.answered || x.asked || "").slice(0, 10) }),
        el("td", {}, el("div", { style: "font-weight:500", text: x.question }), el("div", { style: "color:var(--green)", text: x.answer })),
        el("td", { style: "font-style:italic;color:var(--soft)", text: x.words ? "“" + x.words + "”" : "" }),
        el("td", {}, x.card ? el("button", { type: "button", style: "border:0;background:none;padding:0;color:var(--accent);text-align:left", onclick: () => openCard(x.card) }, titleOf(x.card)) : "")))))));
}

// ---- The API, for another device or a program --------------------------------------
// The same table as README.md.

const ROUTES = [["GET","/api/me","the key's name"],["GET","/api/cards?column=&area=&q=","the cards, each column in order"],["POST","/api/cards","a new card: `title`, `column` (Ideas when not said), `area`, `ref`, `detail`, `quote`, `before`"],["GET","/api/cards/:id","one card, its notes, its history, its decisions"],["PATCH","/api/cards/:id","`title`, `area`, `ref`, `detail`, `quote`, `in_roadmap`"],["POST","/api/cards/:id/move","`{ column, before }`: into a column, before a card or last"],["POST","/api/cards/:id/notes","`{ text, asks }`: a card's talk; `asks` when Claude awaits Diego's reply"],["DELETE","/api/cards/:id","removed, kept to bring back"],["GET","/api/decisions?open=true","the questions, open or all"],["POST","/api/decisions","`{ card, question, options }`"],["PATCH","/api/decisions/:id","`{ answer, words }`: answered, and a note on its card"],["GET","/api/now","what Claude is doing now: its card, its step, what it waits on, since when"],["PUT","/api/now","`{ card, step, state, waiting }`: said by Claude at each step; `state` is working, waiting or idle"],["GET","/api/queue","Claude's queue in order: cards and tasks, each with its place"],["POST","/api/queue","`{ card }` or `{ title }` for a task; last, `{ before }` or `{ top: true }`"],["POST","/api/queue/:id/move","`{ before }`, `{ top: true }`, or last"],["DELETE","/api/queue/:id","out of the queue; a card waiting in Next goes back to Agreed"],["POST","/api/queue/take","Claude takes the top: it becomes now, its card Building"],["GET","/api/discussions?stage=","open, shaping, ready, became, parked"],["POST","/api/discussions","`{ title, idea, for }` - the idea is its first message"],["GET","/api/discussions/:id","with its summary, options, open questions, conversation and cards"],["PATCH","/api/discussions/:id","`stage`, `summary`, `options`, `questions`, `title`, `idea`, `for`"],["POST","/api/discussions/:id/messages","`{ text, asks }`"],["POST","/api/discussions/:id/cards","a card made from it, linked both ways; it has become cards"],["GET","/api/waiting","what waits for a reply from Claude, and from Diego"],["POST","/api/cards/:id/files","a file onto a card: the bytes as the body, `Content-Type`, `?name=&caption=`"],["POST","/api/discussions/:id/files","a file onto a discussion, the same way"],["GET","/api/files/:id","the file; `DELETE` removes it"],["GET","/api/changes?since=","everything changed since a time"],["GET","/api/export.md","the board as Markdown"]];

function apiPage() {
  return el("main", { class: "page" },
    el("h1", { class: "h", text: "The API" }),
    el("p", { class: "sub", style: "margin:0", text: "Every request carries a key: Authorization: Bearer kb_… Each device and Claude have their own, made with tools/board/keys.py, and every change is signed with the key's name." }),
    el("div", { class: "scrollx" }, el("table", { class: "dec" },
      el("thead", {}, el("tr", {}, el("th", { text: "" }), el("th", { text: "Path" }), el("th", { text: "What it does" }))),
      el("tbody", {}, ROUTES.map(([m, path, what]) => el("tr", {},
        el("td", { style: "font:500 12px var(--mono);color:var(--accent)", text: m }),
        el("td", { style: "font:12.5px var(--mono);white-space:nowrap", text: path }),
        el("td", { text: what.replace(/`/g, "") })))))));
}

// ---- Drawing ----------------------------------------------------------------------------------

function renderMain() {
  const main = document.getElementById("main");
  if (!main) return render();
  const scroll = document.querySelector(".columns");
  const left = scroll ? scroll.scrollLeft : 0;
  const tops = Object.fromEntries([...document.querySelectorAll(".col .list")].map((l) => [l.dataset.col, l.scrollTop]));
  const view = S.view === "queue" ? queue() : S.view === "discussions" ? discussions() : S.view === "decisions" ? decisions() : S.view === "api" ? apiPage() : S.view === "needs" ? needsPage() : board();
  main.replaceChildren(view);
  const again = document.querySelector(".columns");
  if (again) {
    again.scrollLeft = left;
    document.querySelectorAll(".col .list").forEach((l) => { l.scrollTop = tops[l.dataset.col] || 0; });
    document.documentElement.style.setProperty("--above", Math.round(again.getBoundingClientRect().top + window.scrollY) + "px");
  }
}

function render() {
  const app = document.getElementById("app");
  if (!KEY) { app.replaceChildren(gate()); return; }
  app.replaceChildren(header(), el("div", { id: "main" }));
  renderMain();
}

(async () => {
  if (!KEY) { render(); return; }
  try {
    S.me = (await api("/api/me")).name;
    await load();
  } catch (e) {}
  render();
})();
</script>
